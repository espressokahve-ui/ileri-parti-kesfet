<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İleri Parti — Keşfet Yönetim</title>
<style>
  :root{--navy:#1D3A5C;--red:#E11D2A;--cream:#F6F4EF;--ink:#15161B;--line:#e6e2da}
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  body{background:#f4f1ea;color:var(--ink)}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mk{width:40px;height:40px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
  .brand b{font-size:18px;font-weight:900}.brand small{display:block;color:#8a8578;font-size:11px}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:800;cursor:pointer}
  .btn-red{background:var(--red);color:#fff}.btn-navy{background:var(--navy);color:#fff}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:#444}
  .btn:active{transform:scale(.98)}
  /* login */
  #login{max-width:400px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
  #login h1{font-size:22px;margin-bottom:4px}#login p{color:#8a8578;font-size:14px;margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:700;color:#666;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15px;background:#fff;font-family:inherit}
  .field textarea{resize:vertical;line-height:1.5}
  .msg{font-size:13px;margin-top:10px;min-height:18px}
  .msg.err{color:var(--red)}.msg.ok{color:#1a8f45}
  /* panel */
  #panel{display:none}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
  .card .th{width:56px;height:70px;border-radius:8px;background:var(--navy);flex:none;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-size:10px;overflow:hidden}
  .card .info{flex:1;min-width:0}
  .card .info .e{font-size:11px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.08em}
  .card .info h3{font-size:16px;font-weight:800;margin:2px 0}
  .card .info p{font-size:13px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .acts{display:flex;gap:6px;flex:none}
  .card .acts button{border:none;background:#f0ece4;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;color:#444}
  .card .acts .del{color:var(--red)}
  .badge-off{font-size:10px;background:#eee;color:#999;padding:2px 7px;border-radius:5px;margin-left:6px}
  /* form modal */
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;overflow-y:auto;padding:20px 12px}
  #modal .box{max-width:600px;margin:0 auto;background:#fff;border-radius:18px;padding:24px 22px}
  #modal h2{font-size:20px;margin-bottom:16px}
  .row2{display:flex;gap:12px}.row2>*{flex:1}
  .upnote{font-size:12px;color:#8a8578;margin-top:4px}
  .preview{margin-top:8px;border-radius:10px;overflow:hidden;max-height:160px}
  .preview img,.preview video{width:100%;display:block}
  .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .hint{background:#fff7ed;border:1px solid #f5d9b8;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#8a5a1a;margin-bottom:16px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <!-- GİRİŞ -->
  <div id="login">
    <div class="brand" style="margin-bottom:18px"><div class="mk">%%MK%%</div><div><b>İLERİ PARTİ</b><small>Keşfet Yönetim Paneli</small></div></div>
    <h1>Giriş</h1><p>İçerik yönetmek için giriş yapın.</p>
    <div class="field"><label>E-posta</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Şifre</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="btn btn-red" style="width:100%" id="loginBtn">Giriş Yap</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- PANEL -->
  <div id="panel">
    <div class="top">
      <div class="brand"><div class="mk">%%MK%%</div><div><b>Keşfet Yönetim</b><small id="who"></small></div></div>
      <div style="display:flex;gap:8px"><button class="btn btn-navy" id="newBtn">+ Yeni Reel</button><button class="btn btn-ghost" id="logoutBtn">Çıkış</button></div>
    </div>
    <div class="hint">Sürükleyerek değil, <b>Sıra</b> numarasıyla dizilir (küçükten büyüğe). Görsel/video yüklerken önerilen: görsel &lt;2MB, video 720p ve &lt;15 sn.</div>
    <div id="list"></div>
  </div>
</div>

<!-- FORM -->
<div id="modal"><div class="box">
  <h2 id="modalTitle">Yeni Reel</h2>
  <div class="row2">
    <div class="field"><label>Sıra</label><input id="f_sira" type="number" value="0"></div>
    <div class="field"><label>Tema (renk)</label><select id="f_tema"><option value="lacivert">Lacivert</option><option value="koyu">Koyu Mavi</option><option value="kirmizi">Kırmızı</option><option value="krem">Krem (açık)</option></select></div>
  </div>
  <div class="field"><label>Etiket (eyebrow) — üstteki küçük yazı</label><input id="f_eyebrow" placeholder="ör. Manifesto"></div>
  <div class="field"><label>Başlık</label><input id="f_baslik" placeholder="ör. Tek ırk,"></div>
  <div class="field"><label>Kırmızı vurgu (başlığın kırmızı kısmı) — opsiyonel</label><input id="f_vurgu" placeholder="ör. insan ırkı."></div>
  <div class="field"><label>Özet (reel üstünde görünen kısa metin)</label><textarea id="f_ozet" rows="2"></textarea></div>
  <div class="field"><label>Detay (Detaylı'da açılan tam metin — HTML olabilir)</label><textarea id="f_detay" rows="5" placeholder="&lt;p&gt;...&lt;/p&gt; &lt;h2&gt;Başlık&lt;/h2&gt;"></textarea></div>
  <div class="row2">
    <div class="field"><label>Medya türü</label><select id="f_medyatur"><option value="yok">Yok (sadece renk)</option><option value="gorsel">Görsel</option><option value="video">Video</option></select></div>
    <div class="field"><label>Aktif mi?</label><select id="f_aktif"><option value="true">Evet (göster)</option><option value="false">Hayır (gizle)</option></select></div>
  </div>
  <div class="field" id="uploadWrap"><label>Görsel / Video yükle</label><input id="f_file" type="file" accept="image/*,video/*"><div class="upnote" id="upnote"></div><div class="preview" id="preview"></div></div>
  <div class="msg" id="formMsg"></div>
  <div class="foot"><button class="btn btn-ghost" id="cancelBtn">Vazgeç</button><button class="btn btn-red" id="saveBtn">Kaydet</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SB_URL = "https://cdhqolhjoxpytgujpkyb.supabase.co";
  const SB_KEY = "sb_publishable_Y5i-yPPKSYMxgSFZA7wDPQ_iU4PsUTe";
  const sb = window.supabase.createClient(SB_URL, SB_KEY);
  const MK = `<svg width="24" height="24" viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M30 32 46 50 30 68"/><path d="M50 32 66 50 50 68"/></g></svg>`;
  document.querySelectorAll('.mk').forEach(m=>m.innerHTML=MK);

  const $ = id => document.getElementById(id);
  let editId = null;

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ showPanel(session); } else { $('login').style.display='block'; }
  }
  function showPanel(session){
    $('login').style.display='none'; $('panel').style.display='block';
    $('who').textContent = session.user.email;
    loadList();
  }
  $('loginBtn').onclick = async () => {
    $('loginMsg').className='msg'; $('loginMsg').textContent='Giriş yapılıyor...';
    const { data, error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
    if(error){ $('loginMsg').className='msg err'; $('loginMsg').textContent='Hata: '+error.message; return; }
    showPanel(data.session);
  };
  $('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

  const TEMA = {lacivert:'#1D3A5C',koyu:'#16324f',kirmizi:'#E11D2A',krem:'#c9c2b3'};
  async function loadList(){
    const { data, error } = await sb.from('reels').select('*').order('sira',{ascending:true});
    const list = $('list');
    if(error){ list.innerHTML = '<div class="hint" style="background:#fde8e8;border-color:#f5b8b8;color:#a11">Yüklenemedi: '+error.message+'</div>'; return; }
    if(!data.length){ list.innerHTML = '<div class="card"><div class="info"><p>Henüz reel yok. Sağ üstten <b>+ Yeni Reel</b> ile ekleyin.</p></div></div>'; return; }
    list.innerHTML = data.map(r => {
      const th = r.medya_tur==='gorsel' && r.medya_url ? `style="background-image:url(${r.medya_url})"` :
                 (r.medya_tur==='video' ? `style="background:#111"` : `style="background:${TEMA[r.tema]||'#1D3A5C'}"`);
      const off = r.aktif ? '' : '<span class="badge-off">gizli</span>';
      const ico = r.medya_tur==='video' ? '🎥' : (r.medya_tur==='gorsel' ? '' : '');
      return `<div class="card"><div class="th" ${th}>${ico}</div>
        <div class="info"><div class="e">${esc(r.eyebrow||'')} · sıra ${r.sira}</div>
        <h3>${esc(r.baslik||'')} <span style="color:#E11D2A">${esc(r.vurgu||'')}</span>${off}</h3>
        <p>${esc(r.ozet||'')}</p></div>
        <div class="acts"><button onclick="editReel(${r.id})">Düzenle</button><button class="del" onclick="delReel(${r.id})">Sil</button></div></div>`;
    }).join('');
  }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  $('newBtn').onclick = () => openForm(null);
  $('cancelBtn').onclick = () => { $('modal').style.display='none'; };
  window.editReel = async (id) => {
    const { data } = await sb.from('reels').select('*').eq('id',id).single();
    openForm(data);
  };
  window.delReel = async (id) => {
    if(!confirm('Bu reel silinsin mi?')) return;
    const { error } = await sb.from('reels').delete().eq('id',id);
    if(error){ alert('Silinemedi: '+error.message); return; }
    loadList();
  };

  function openForm(r){
    editId = r ? r.id : null;
    $('modalTitle').textContent = r ? 'Reel Düzenle' : 'Yeni Reel';
    $('f_sira').value = r ? r.sira : nextSira();
    $('f_tema').value = r ? (r.tema||'lacivert') : 'lacivert';
    $('f_eyebrow').value = r ? (r.eyebrow||'') : '';
    $('f_baslik').value = r ? (r.baslik||'') : '';
    $('f_vurgu').value = r ? (r.vurgu||'') : '';
    $('f_ozet').value = r ? (r.ozet||'') : '';
    $('f_detay').value = r ? (r.detay||'') : '';
    $('f_medyatur').value = r ? (r.medya_tur||'yok') : 'yok';
    $('f_aktif').value = r ? String(r.aktif) : 'true';
    $('f_file').value=''; $('formMsg').textContent=''; $('upnote').textContent = r&&r.medya_url ? 'Mevcut medya var. Yeni dosya seçersen değişir.' : '';
    $('preview').innerHTML = r && r.medya_url ? (r.medya_tur==='video' ? `<video src="${r.medya_url}" muted></video>` : `<img src="${r.medya_url}">`) : '';
    window.__curUrl = r ? r.medya_url : null;
    $('modal').style.display='block';
  }
  let cachedSira = 0;
  function nextSira(){ return cachedSira + 10; }

  $('f_file').onchange = () => {
    const f = $('f_file').files[0]; if(!f) return;
    const url = URL.createObjectURL(f);
    $('preview').innerHTML = f.type.startsWith('video') ? `<video src="${url}" muted></video>` : `<img src="${url}">`;
    $('f_medyatur').value = f.type.startsWith('video') ? 'video' : 'gorsel';
  };

  $('saveBtn').onclick = async () => {
    $('formMsg').className='msg'; $('formMsg').textContent='Kaydediliyor...';
    let medya_url = window.__curUrl || null;
    const f = $('f_file').files[0];
    if(f){
      const path = 'reel-'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
      const { error:upErr } = await sb.storage.from('medya').upload(path, f, { upsert:true });
      if(upErr){ $('formMsg').className='msg err'; $('formMsg').textContent='Yükleme hatası: '+upErr.message; return; }
      medya_url = sb.storage.from('medya').getPublicUrl(path).data.publicUrl;
    }
    const rec = {
      sira: parseInt($('f_sira').value)||0, tema: $('f_tema').value,
      eyebrow: $('f_eyebrow').value.trim(), baslik: $('f_baslik').value.trim(), vurgu: $('f_vurgu').value.trim(),
      ozet: $('f_ozet').value.trim(), detay: $('f_detay').value,
      medya_tur: $('f_medyatur').value, medya_url, aktif: $('f_aktif').value==='true'
    };
    let error;
    if(editId){ ({ error } = await sb.from('reels').update(rec).eq('id',editId)); }
    else { ({ error } = await sb.from('reels').insert(rec)); }
    if(error){ $('formMsg').className='msg err'; $('formMsg').textContent='Kaydedilemedi: '+error.message; return; }
    $('modal').style.display='none'; loadList();
  };

  // sıra takibi (yeni reel için)
  sb.from('reels').select('sira').order('sira',{ascending:false}).limit(1).then(({data})=>{ if(data&&data.length) cachedSira=data[0].sira; });

  init();
</script>
</body>
</html>
