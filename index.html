<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>İleri Parti — Keşfet</title>
<style>
  :root{--navy:#1D3A5C;--navy-d:#14263f;--red:#E11D2A;--cream:#F6F4EF;--ink:#15161B;--white:#fff}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0b1420;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
  .phone{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;background:#000;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none}
  .feed::-webkit-scrollbar{display:none}
  .reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
  .media{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
  video.media{width:100%;height:100%;object-fit:cover}
  .scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 50%,rgba(0,0,0,.7) 100%)}
  .content{position:relative;z-index:3;padding:22px 84px 32px 22px;color:#fff}
  .eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--red);padding:5px 10px;border-radius:6px;margin-bottom:14px}
  h1{font-size:37px;line-height:1.06;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 20px rgba(0,0,0,.5);margin-bottom:12px}
  h1 .r{color:#ff5a67}
  .sub{font-size:16px;line-height:1.5;font-weight:500;opacity:.97;max-width:300px;text-shadow:0 1px 12px rgba(0,0,0,.6)}
  .handle{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .handle .dot{width:34px;height:34px;border-radius:50%;background:var(--navy);border:2px solid #fff;display:grid;place-items:center;flex:none}
  .handle b{font-size:15px;font-weight:800}.handle .follow{margin-left:6px;font-size:12px;font-weight:800;border:1.5px solid #fff;border-radius:7px;padding:4px 12px}
  .tags{margin-top:12px;font-size:14px;font-weight:700;color:#cfe0ff}
  .detail-btn{display:inline-flex;align-items:center;gap:7px;margin-top:16px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.65);color:#fff;font-weight:800;font-size:14px;padding:11px 20px;border-radius:11px;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .rail{position:absolute;right:12px;bottom:34px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:20px}
  .rail .av{width:46px;height:46px;border-radius:50%;background:var(--navy);border:2px solid #fff;display:grid;place-items:center;margin-bottom:4px}
  .act{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;cursor:pointer}
  .act svg{width:32px;height:32px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .act span{font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .act.liked svg{fill:var(--red);stroke:var(--red)}
  .prog{position:absolute;top:9px;left:10px;right:62px;z-index:16;display:flex;gap:3px}
  .prog i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.32)}
  .prog i.on{background:rgba(255,255,255,.95)}
  .b-navy .media,.b-navy{background:radial-gradient(120% 90% at 50% 0%,#26527f 0%,var(--navy) 45%,var(--navy-d) 100%)}
  .b-red{background:radial-gradient(120% 90% at 50% 0%,#e5384a 0%,#c11526 55%,#8e1020 100%)}
  .b-krem{background:linear-gradient(160deg,#fff 0%,var(--cream) 60%,#ece7dd 100%)}
  .b-koyu{background:linear-gradient(160deg,#16324f 0%,#0f2137 100%)}
  .b-krem .content{color:var(--ink)}.b-krem h1{text-shadow:none}.b-krem h1 .r{color:var(--red)}
  .b-krem .sub{color:#3a3f47;text-shadow:none;opacity:1}.b-krem .handle b{color:var(--ink)}.b-krem .handle .follow{border-color:var(--navy);color:var(--navy)}
  .b-krem .rail .act{color:var(--navy)}.b-krem .tags{color:var(--red)}.b-krem .detail-btn{background:var(--navy);border-color:var(--navy);color:#fff}
  .chevrons{position:absolute;inset:0;opacity:.09;overflow:hidden;z-index:0}
  .chevrons svg{position:absolute;right:-40px;top:50%;transform:translateY(-50%);height:130%}
  .menu-btn{position:absolute;top:13px;right:12px;z-index:20;width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:none;display:grid;place-items:center;cursor:pointer}
  .menu-btn span{display:block;width:20px;height:2.5px;background:#fff;border-radius:2px;margin:2.6px 0}
  .menu-overlay{position:absolute;inset:0;z-index:40;background:linear-gradient(160deg,#16324f,#0b1a2c);transform:translateX(100%);transition:transform .32s;display:flex;flex-direction:column;padding:24px 22px}
  .menu-overlay.open{transform:translateX(0)}
  .menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .menu-head .t{display:flex;align-items:center;gap:11px;color:#fff}.menu-head .t b{font-size:19px;font-weight:900}.menu-head .t span{font-size:11px;color:#9fb3cc;display:block}
  .menu-close{background:none;border:none;color:#fff;font-size:32px;cursor:pointer;padding:0 6px}
  .menu-list{overflow-y:auto}
  .mi{display:flex;align-items:center;gap:10px;padding:14px 6px;color:#c9d6e6;font-size:16px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.09);cursor:pointer}
  .mi:active{color:#fff;background:rgba(255,255,255,.04)}.mi .n{font-size:12px;font-weight:900;color:var(--red);width:26px}.mi::after{content:"▶";margin-left:auto;font-size:11px;color:var(--red)}
  .sheet{position:absolute;inset:0;z-index:50;background:var(--cream);transform:translateY(100%);transition:transform .34s;display:flex;flex-direction:column}
  .sheet.open{transform:translateY(0)}
  .sheet-top{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid #e6e2da;background:#fff;flex:none}
  .sheet-top .back{background:#f0ece4;border:none;width:38px;height:38px;border-radius:10px;font-size:24px;color:var(--navy);cursor:pointer}
  .sheet-top b{font-size:16px;color:var(--ink);font-weight:800}
  .sheet-body{overflow-y:auto;padding:24px 22px 70px;color:#333}
  .sheet-body .eyebrow2{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  .sheet-body h1{font-size:28px;font-weight:900;color:var(--ink);line-height:1.14;margin:8px 0 18px;text-shadow:none}
  .sheet-body h2{font-size:18px;font-weight:800;color:var(--navy);margin:24px 0 8px}
  .sheet-body p{font-size:16px;line-height:1.75;color:#3a3f47;margin:0 0 14px}
  .sheet-body .lead{font-size:18px;font-weight:700;color:var(--ink)}
  .elist{list-style:none;margin-top:8px}
  .elist li{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #ece7dd;cursor:pointer}
  .elist li:active{background:#faf7f1}
  .elist li .en{font-size:13px;font-weight:900;color:var(--red);width:30px;flex:none;text-align:center}
  .elist li b{font-size:16px;font-weight:800;color:var(--ink)}
  .elist li .go{margin-left:auto;color:#b8b0a2;font-size:19px}
  .eitem{margin-top:12px;padding-left:2px}
  .eitem ul{list-style:none;padding:0}
  .eitem li{position:relative;padding:11px 0 11px 24px;font-size:15px;line-height:1.6;color:#3a3f47;border-bottom:1px solid #f2ede4}
  .eitem li::before{content:"\203a";position:absolute;left:3px;top:11px;color:var(--red);font-weight:900;font-size:16px}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:#8aa;font-size:15px;z-index:2}
  .hint{position:absolute;left:0;right:0;bottom:96px;z-index:5;text-align:center;color:#fff;font-weight:700;font-size:14px;opacity:.9;animation:bob 1.6s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="phone">
  <div class="prog" id="prog"></div>
  <button class="menu-btn" id="menuBtn"><span></span><span></span><span></span></button>
  <div class="menu-overlay" id="menu">
    <div class="menu-head"><div class="t" id="menuBrand"></div><button class="menu-close" id="menuClose">&times;</button></div>
    <div class="menu-list" id="menuList"></div>
  </div>
  <div class="sheet" id="detailView"><div class="sheet-top"><button class="back" id="detailBack">‹</button><b id="detailTitle">Detay</b></div><div class="sheet-body" id="detailBody"></div></div>
  <div class="feed" id="feed"><div class="loading" id="loading">Yükleniyor…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SB_URL="https://cdhqolhjoxpytgujpkyb.supabase.co";
  const SB_KEY="sb_publishable_Y5i-yPPKSYMxgSFZA7wDPQ_iU4PsUTe";
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  const CHEV=`<svg viewBox="0 0 200 400" preserveAspectRatio="none"><g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"><path d="M30 60 120 200 30 340"/><path d="M90 60 180 200 90 340"/><path d="M150 60 240 200 150 340"/></g></svg>`;
  function logoMini(){return `<svg width="34" height="34" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1D3A5C"/><g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M34 35 47 50 34 65"/><path d="M50 35 63 50 50 65"/></g></svg>`;}
  const TEMA={lacivert:'b-navy',koyu:'b-koyu',kirmizi:'b-red',krem:'b-krem'};
  function rail(){return `<div class="rail"><div class="av">${logoMini()}</div>
    <div class="act likeable"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5.5 6 5.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.5 0 5 3.5 3.5 6.5C19 16.5 12 21 12 21z"/></svg><span>8.4B</span></div>
    <div class="act"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-12 7.7L3 21l1.8-6A8.5 8.5 0 1 1 21 11.5z"/></svg><span>1.2B</span></div>
    <div class="act" onclick="sh()"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg><span>Paylaş</span></div>
    <div class="act"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg><span>Kaydet</span></div></div>`;}
  function handle(){return `<div class="handle"><div class="dot">${logoMini()}</div><b>@ileriparti</b><span class="follow">Takip Et</span></div>`;}
  window.sh=function(){if(navigator.share){navigator.share({title:'İleri Parti',url:location.href}).catch(()=>{});}else{alert('Bağlantı: '+location.href);}};

  let REELS=[]; let MADDELER={};
  function reelHTML(r,i){
    const cls=TEMA[r.tema]||'b-navy';
    let bg;
    if(r.medya_tur==='video' && r.medya_url) bg=`<video class="media" autoplay muted loop playsinline src="${r.medya_url}"></video>`;
    else if(r.medya_tur==='gorsel' && r.medya_url) bg=`<div class="media" style="background-image:url(${r.medya_url})"></div>`;
    else bg=`<div class="chevrons">${cls==='b-krem'?CHEV.replace(/#fff/g,'#1D3A5C'):CHEV}</div>`;
    const eb=r.eyebrow?`<span class="eyebrow">${esc(r.eyebrow)}</span>`:'';
    const vurgu=r.vurgu?` <span class="r">${esc(r.vurgu)}</span>`:'';
    const btn=r.detay?`<button class="detail-btn" data-i="${i}">Detaylı →</button>`:'';
    const hint=i===0?'<div class="hint">Yukarı kaydır 👆</div>':'';
    return `<section class="reel ${cls}">${bg}<div class="scrim"></div><div class="content">${handle()}${eb}<h1>${esc(r.baslik)}${vurgu}</h1><div class="sub">${esc(r.ozet||'')}</div>${btn}</div>${hint}${rail()}</section>`;
  }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  const feed=document.getElementById('feed'),prog=document.getElementById('prog'),menu=document.getElementById('menu');
  document.getElementById('menuBrand').innerHTML=logoMini()+'<div><b>İLERİ PARTİ</b><span>İleri Demokrasi ve Ekonomi Partisi</span></div>';

  async function load(){
    const { data, error } = await sb.from('reels').select('*').eq('aktif',true).order('sira',{ascending:true});
    if(error){ feed.innerHTML='<div class="loading">Bağlantı hatası: '+error.message+'</div>'; return; }
    if(!data || !data.length){ feed.innerHTML='<div class="loading">Henüz içerik eklenmemiş.<br>Panelden reel ekleyin.</div>'; return; }
    REELS=data;
    // liste tipi reel'ler için maddeleri çek
    try{
      const ids=data.filter(r=>r.detay_tur==='liste').map(r=>r.id);
      if(ids.length){
        const { data:md } = await sb.from('reel_maddeler').select('*').in('reel_id',ids).order('sira',{ascending:true});
        MADDELER={}; (md||[]).forEach(m=>{ (MADDELER[m.reel_id]=MADDELER[m.reel_id]||[]).push(m); });
      }
    }catch(e){}
    feed.innerHTML=data.map((r,i)=>reelHTML(r,i)).join('');
    // menü
    document.getElementById('menuList').innerHTML=data.map((r,i)=>`<div class="mi" data-goto="${i}"><span class="n">${(i+1<10?'0':'')+(i+1)}</span>${esc(r.eyebrow||r.baslik)}</div>`).join('');
    // progress
    prog.innerHTML=''; data.forEach(()=>prog.appendChild(document.createElement('i')));
    wire();
  }
  function wire(){
    const bars=[...prog.children];
    function upd(){const idx=Math.round(feed.scrollTop/feed.clientHeight);bars.forEach((b,i)=>b.classList.toggle('on',i<=idx));}
    feed.addEventListener('scroll',()=>requestAnimationFrame(upd));upd();
    document.querySelectorAll('.likeable').forEach(a=>a.onclick=()=>a.classList.toggle('liked'));
    document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=()=>{feed.scrollTo({top:(+a.dataset.goto)*feed.clientHeight,behavior:'smooth'});menu.classList.remove('open');});
    const dv=document.getElementById('detailView'),db=document.getElementById('detailBody'),dt=document.getElementById('detailTitle');
    let listMode=null, listReel=null;
    function showList(r){
      listMode='list'; listReel=r; dt.textContent=(r.eyebrow||r.baslik||'');
      const mad=MADDELER[r.id]||[];
      const rows=mad.map((m,i)=>'<li data-mi="'+i+'"><span class="en">'+(i+1<10?'0':'')+(i+1)+'</span><b>'+esc(m.baslik)+'</b><span class="go">\u203a</span></li>').join('');
      db.innerHTML='<div class="eyebrow2">'+esc(r.eyebrow||'')+'</div><h1>'+esc(r.baslik||'')+' '+esc(r.vurgu||'')+'</h1>'+(r.detay?'<p>'+esc(r.detay).replace(/\n/g,'<br>')+'</p>':'')+(mad.length?'<ul class="elist">'+rows+'</ul>':'<p style="color:#999">Henüz madde eklenmemiş.</p>');
      db.scrollTop=0;
      db.querySelectorAll('.elist li').forEach(li=>li.onclick=()=>showItem(+li.dataset.mi));
    }
    function showItem(i){
      listMode='item'; const m=(MADDELER[listReel.id]||[])[i];
      dt.textContent=m.baslik;
      db.innerHTML='<div class="eyebrow2">'+esc(listReel.eyebrow||'')+'</div><h1>'+esc(m.baslik)+'</h1><div class="eitem">'+(m.icerik||'')+'</div>';
      db.scrollTop=0;
    }
    document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
      const r=REELS[+b.dataset.i];
      if(r.detay_tur==='liste'){ showList(r); dv.classList.add('open'); return; }
      listMode=null; dt.textContent=(r.baslik||'')+' '+(r.vurgu||'');
      db.innerHTML='<div class="eyebrow2">'+esc(r.eyebrow||'')+'</div><h1>'+esc(r.baslik||'')+' '+esc(r.vurgu||'')+'</h1>'+(r.detay||'');
      db.scrollTop=0; dv.classList.add('open');
    });
    document.getElementById('detailBack').onclick=()=>{ if(listMode==='item'){ showList(listReel); } else { dv.classList.remove('open'); listMode=null; } };
  }
  document.getElementById('menuBtn').onclick=()=>menu.classList.add('open');
  document.getElementById('menuClose').onclick=()=>menu.classList.remove('open');
  load();
</script>
</body>
</html>
